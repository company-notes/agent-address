name: Deploy Agent Address V2 production

on:
  push:
    branches: [feat/agent-session-identity-v2-20261112]
    paths:
      - .github/workflows/production-v2.yml
      - deploy/production-release.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-address-production
  cancel-in-progress: false

jobs:
  deploy-v2:
    name: Verify and replace official Agent Address with V2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: 15cad3f5-3670-4f66-8951-2bb5d4881406
      CLOUDFLARE_D1_DATABASE_NAME: company-notes-agent-address-v2
      CLOUDFLARE_OAUTH_KV_ID: a0d03e78550740789fe48711faec489a
      CLOUDFLARE_WORKER_NAME: agent-address
      CLOUDFLARE_CUSTOM_DOMAIN: address.company-notes.com
      ADMIN_ACCESS_TEAM_NAME: ${{ vars.ADMIN_ACCESS_TEAM_NAME }}
      ADMIN_ALLOWED_EMAILS: ${{ vars.ADMIN_ALLOWED_EMAILS }}
      ADMIN_ACCESS_AUDIENCE: ${{ vars.ADMIN_ACCESS_AUDIENCE }}
    steps:
      - name: Check out the exact V2 source branch
        uses: actions/checkout@v4
      - name: Use the repository-pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify Cloudflare account, official Worker and isolated V2 database
        shell: bash
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = "b471fa2c14470c664eec0a37616accd6" || {
            echo "::error::Wrong Cloudflare account."
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing Cloudflare deployment API token."
            exit 1
          }
          test "$CLOUDFLARE_WORKER_NAME" = "agent-address"
          test "$CLOUDFLARE_CUSTOM_DOMAIN" = "address.company-notes.com"
          test "$CLOUDFLARE_D1_DATABASE_NAME" = "company-notes-agent-address-v2"
          test "$CLOUDFLARE_D1_DATABASE_ID" = "15cad3f5-3670-4f66-8951-2bb5d4881406"
          test "$CLOUDFLARE_OAUTH_KV_ID" = "a0d03e78550740789fe48711faec489a"
      - name: Install backend dependencies
        run: npm ci
      - name: Verify TypeScript, code principles, audit, and real Worker/D1 scenarios
        run: |
          npm run check
          npm run style:check
          npm run audit:check
          npm test
          node --test scripts/check-d1-cutover.checks.mjs
      - name: Install and build Organization Portal and Admin UI
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
          npm --prefix web audit --audit-level=high
      - name: Verify Organization Portal with real local browser, OAuth, and D1
        env:
          CLOUDFLARE_CUSTOM_DOMAIN: ""
        run: |
          npm --prefix web install --no-save --no-package-lock --no-audit --no-fund playwright@1.65.0
          node web/e2e/portal-browser.mjs
          node web/e2e/admin-browser.mjs
      - name: Generate production-only Wrangler config
        run: |
          node scripts/prepare-deploy.mjs
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const c = JSON.parse(readFileSync(".wrangler.deploy.jsonc"));
            if (c.name !== "agent-address" ||
                c.d1_databases.find(b => b.binding === "DB")?.database_id !==
                  "15cad3f5-3670-4f66-8951-2bb5d4881406" ||
                c.kv_namespaces.find(b => b.binding === "OAUTH_KV")?.id !==
                  "a0d03e78550740789fe48711faec489a" ||
                c.routes?.length !== 1 ||
                c.routes[0].pattern !== "address.company-notes.com" ||
                c.routes[0].custom_domain !== true) {
              throw Error("Refusing mismatched production V2 Wrangler config.");
            }
          '
      - name: Dry-run bundle without production mutation
        run: npx wrangler deploy --dry-run --config .wrangler.deploy.jsonc --outdir .wrangler-production-check
      - name: Refuse V1 or mixed remote D1 schema
        run: node scripts/check-d1-cutover.mjs --remote
      - name: Apply V2 schema to new production D1 only
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.deploy.jsonc
      - name: Replace official Agent Address Worker with tested V2 bundle
        run: npx wrangler deploy --config .wrangler.deploy.jsonc
      - name: Verify official V2 domain, OAuth metadata, Organization Portal and authorization
        run: node scripts/smoke-v2-production.mjs
