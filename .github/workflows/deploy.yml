name: Verify and deploy Agent Address

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Enforce code readability and exception-handling rules
        run: npm run style:check
      - name: Install admin UI dependencies
        run: npm --prefix web ci --no-audit --no-fund
      - name: Build admin UI
        run: npm --prefix web run build
      - name: Check admin UI dependencies (high/critical)
        run: npm --prefix web audit --audit-level=high
      - name: Validate admin Worker bundle without deployment
        env:
          CLOUDFLARE_D1_DATABASE_ID: "00000000-0000-0000-0000-000000000000"
          CLOUDFLARE_OAUTH_KV_ID: "00000000000000000000000000000000"
          ADMIN_ACCESS_TEAM_NAME: ${{ vars.ADMIN_ACCESS_TEAM_NAME }}
          ADMIN_ALLOWED_EMAILS: ${{ vars.ADMIN_ALLOWED_EMAILS }}
          ADMIN_ACCESS_AUDIENCE: ${{ vars.ADMIN_ACCESS_AUDIENCE }}
        run: |
          node scripts/prepare-deploy.mjs
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            for (const name of ["ADMIN_ACCESS_TEAM_NAME", "ADMIN_ALLOWED_EMAILS", "ADMIN_ACCESS_AUDIENCE"]) {
              const value = process.env[name]?.trim() ?? "";
              console.log(name + " fingerprint: " + createHash("sha256").update(value).digest("hex").slice(0, 16));
            }'
          npx wrangler deploy --dry-run --config .wrangler.deploy.jsonc --outdir .wrangler-verify
      - name: Enforce dependency security (high/critical)
        run: npm run audit:check
      - name: Run tests
        run: npm test
      - name: Install pinned Playwright (use runner's preinstalled Chrome)
        run: |
          npm --prefix web install --no-save --no-package-lock --no-audit --no-fund playwright@1.65.0
      - name: Browser E2E against local test server (never production)
        run: node web/e2e/admin-browser.mjs
      - name: Real browser Portal flow against local Worker, OAuth and D1
        run: node web/e2e/portal-browser.mjs
      - name: Verify isolated D1 schema cutover guard
        run: |
          node --test scripts/check-d1-cutover.checks.mjs
          node scripts/check-d1-cutover.mjs --local
          npx wrangler d1 execute DB --local --config .wrangler.deploy.jsonc \
            --persist-to .wrangler-verify/legacy \
            --command "CREATE TABLE addresses (id TEXT PRIMARY KEY)"
          if node scripts/check-d1-cutover.mjs --local --persist-to=.wrangler-verify/legacy; then
            echo "::error::D1 guard accepted a legacy Host/Work schema"
            exit 1
          fi
      - name: Validate deployment script syntax
        run: |
          node --check scripts/prepare-deploy.mjs
          node --check scripts/resolve-cloudflare-ids.mjs
          node --check scripts/check-d1-cutover.mjs

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agent-address-production
      cancel-in-progress: false
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_OAUTH_KV_ID: ${{ vars.CLOUDFLARE_OAUTH_KV_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_CUSTOM_DOMAIN: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN }}
      ADMIN_ACCESS_TEAM_NAME: ${{ vars.ADMIN_ACCESS_TEAM_NAME }}
      ADMIN_ALLOWED_EMAILS: ${{ vars.ADMIN_ALLOWED_EMAILS }}
      ADMIN_ACCESS_AUDIENCE: ${{ vars.ADMIN_ACCESS_AUDIENCE }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install admin UI dependencies
        run: npm --prefix web ci --no-audit --no-fund
      - name: Build admin UI
        run: npm --prefix web run build
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID CLOUDFLARE_OAUTH_KV_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions configuration: ${name}"
              exit 1
            fi
          done
      - name: Resolve canonical Cloudflare resources via existing GitHub Secrets and Variables
        run: node scripts/resolve-cloudflare-ids.mjs
      - name: Generate deployment configuration
        run: node scripts/prepare-deploy.mjs
      - name: Verify official Worker and original resource names before any remote change
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync(".wrangler.deploy.jsonc"));
            if (process.env.CLOUDFLARE_ACCOUNT_ID !== "b471fa2c14470c664eec0a37616accd6" ||
                config.name !== "agent-address" ||
                config.d1_databases.find(x => x.binding === "DB")?.database_name !== "company-notes-agent-address" ||
                config.kv_namespaces.find(x => x.binding === "OAUTH_KV")?.id !== process.env.CLOUDFLARE_OAUTH_KV_ID ||
                config.d1_databases.find(x => x.binding === "DB")?.database_id !== process.env.CLOUDFLARE_D1_DATABASE_ID ||
                config.routes?.[0]?.pattern !== "address.company-notes.com" ||
                config.routes?.[0]?.custom_domain !== true) {
              throw Error("Canonical Agent Address production configuration mismatch.");
            }
          '
      - name: Validate Worker bundle without production mutation
        run: npx wrangler deploy --dry-run --config .wrangler.deploy.jsonc --outdir .wrangler-production-check
      - name: Refuse incompatible D1 cutover before any remote migration
        run: node scripts/check-d1-cutover.mjs --remote
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.deploy.jsonc
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --config .wrangler.deploy.jsonc

  smoke:
    name: Smoke test published Worker
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify official OAuth, MCP, Organization Portal and protected routes
        run: node scripts/smoke-production.mjs
