name: Deploy isolated Agent Address V2 Preview

on:
  push:
    branches:
      - feat/agent-session-identity-v2-20261112
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-address-v2-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Verify, migrate and deploy isolated Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: a44947a1-392b-411a-84ef-7efefb83215e
      CLOUDFLARE_D1_DATABASE_NAME: agent-address-v2-preview
      CLOUDFLARE_OAUTH_KV_ID: 923fda813d954f3aae26925c9afea3cd
      CLOUDFLARE_WORKER_NAME: agent-address-v2-preview
      CLOUDFLARE_CUSTOM_DOMAIN: ""
      AGENT_ADDRESS_V2_PREVIEW_URL: https://agent-address-v2-preview.nuwainfo.workers.dev
      ADMIN_ACCESS_TEAM_NAME: ${{ vars.ADMIN_ACCESS_TEAM_NAME }}
      ADMIN_ALLOWED_EMAILS: ${{ vars.ADMIN_ALLOWED_EMAILS }}
      ADMIN_ACCESS_AUDIENCE: ${{ vars.ADMIN_ACCESS_AUDIENCE }}
    steps:
      - name: Checkout V2 branch only
        uses: actions/checkout@v4
      - name: Node.js from project pin
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify Cloudflare account and isolated Preview config
        shell: bash
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = "b471fa2c14470c664eec0a37616accd6" || {
            echo "::error::Cloudflare account mismatch; refusing to deploy."
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing Cloudflare API token."
            exit 1
          }
          test "$CLOUDFLARE_WORKER_NAME" = "agent-address-v2-preview"
          test "$CLOUDFLARE_D1_DATABASE_NAME" = "agent-address-v2-preview"
      - name: Install backend dependencies
        run: npm ci
      - name: Typecheck, code principles and Worker/D1 scenario tests
        run: |
          npm run check
          npm run style:check
          npm test
      - name: Build admin UI
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
      - name: Generate Preview-only configuration
        run: |
          node scripts/prepare-deploy.mjs
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync(".wrangler.deploy.jsonc"));
            if (config.name !== "agent-address-v2-preview" ||
                config.d1_databases.find(x => x.binding === "DB")?.database_id !==
                  "a44947a1-392b-411a-84ef-7efefb83215e" ||
                config.kv_namespaces.find(x => x.binding === "OAUTH_KV")?.id !==
                  "923fda813d954f3aae26925c9afea3cd" ||
                config.routes?.length) {
              throw Error("Preview Worker configuration escaped isolated bindings.");
            }
          '
      - name: Validate Worker bundle before live changes
        run: npx wrangler deploy --dry-run --config .wrangler.deploy.jsonc --outdir .wrangler-preview-check
      - name: Verify D1 guard accepts only Cloudflare metadata and V2 schema
        run: node --test scripts/check-d1-cutover.checks.mjs
      - name: Refuse old, mixed, or incompatible remote D1
        run: node scripts/check-d1-cutover.mjs --remote
      - name: Apply fresh V2 D1 migrations to Preview database only
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.deploy.jsonc
      - name: Deploy separate Preview Worker (never production worker)
        run: npx wrangler deploy --config .wrangler.deploy.jsonc
      - name: Read-only live Preview smoke
        run: node scripts/smoke-preview.mjs
