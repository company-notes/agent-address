openapi: 3.1.0
info:
  title: Agent Address API
  version: 0.2.0
  description: Hierarchical organization, host namespace, and concrete work-address registry for independent agent applications. Address responses include kind=host or kind=work.
servers:
  - url: https://address.company-notes.com
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Healthy

  /v1/orgs:
    post:
      summary: Create an organization
      parameters:
        - in: header
          name: X-Registration-Key
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, displayName]
              properties:
                slug: { type: string, example: example-org }
                displayName: { type: string, example: Example Organization }
      responses:
        '201':
          description: Organization created; orgToken is returned once

  /v1/orgs/{org}/addresses:
    parameters:
      - in: path
        name: org
        required: true
        schema: { type: string }
    post:
      summary: Create a root host/environment namespace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: { type: string, example: mypc }
                displayName: { type: string, example: Main development PC }
      responses:
        '201':
          description: Root address created; addressToken is returned once
    get:
      summary: List all addresses in an organization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Address list

  /v1/addresses/{addressId}/children:
    parameters:
      - in: path
        name: addressId
        required: true
        schema: { type: string }
    post:
      summary: Create a child work address under an owned address
      description: The bearer token must belong to the parent address.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: { type: string, example: build-release }
                displayName: { type: string, example: Build Release 0.18.3 }
      responses:
        '201':
          description: Child address created; addressToken is returned once

  /v1/addresses/{addressId}:
    parameters:
      - in: path
        name: addressId
        required: true
        schema: { type: string }
    patch:
      summary: Rename an owned address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: { type: string, example: release-0183 }
      responses:
        '200':
          description: Renamed address
    delete:
      summary: Revoke an owned address and all descendants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Revoked address; its path may be reused by a future active address

  /v1/resolve/{org}/{path}:
    parameters:
      - in: path
        name: org
        required: true
        schema: { type: string }
      - in: path
        name: path
        required: true
        schema:
          type: string
          example: mypc/build-release
    get:
      summary: Resolve an exact hierarchical address
      responses:
        '200':
          description: Active address

  /v1/me:
    get:
      summary: Resolve the bearer credential to its organization or address identity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated identity

  /mcp:
    post:
      summary: Remote MCP endpoint (Streamable HTTP, OAuth 2.1)
      description: >
        Model Context Protocol server. Clients discover the authorization server from
        /.well-known/oauth-protected-resource, register dynamically at /register, and authorize at
        /authorize (account sign-in or sign-up) with PKCE. Tools: agentAddressGetStatus,
        agentAddressClaimWork, agentAddressRenameWork, agentAddressReleaseWork, agentAddressResolve,
        agentAddressInstallLocal. One account owns at most one organization. Each tool is a thin
        wrapper over the Account API below (/v1/account/*) - MCP is a client of that API, not a
        parallel implementation.
      security:
        - oauth: []
      responses:
        '200':
          description: MCP JSON-RPC or SSE response
        '401':
          description: Missing or invalid OAuth access token

  /authorize:
    get:
      summary: OAuth authorization page (sign in or create an account)
      responses:
        '200':
          description: HTML form
    post:
      summary: Submit the sign-in or sign-up form and complete the grant
      responses:
        '302':
          description: Redirect to the client with an authorization code
        '400':
          description: Form re-rendered with an error

  /token:
    post:
      summary: OAuth token endpoint (authorization_code, refresh_token)
      responses:
        '200':
          description: Access and refresh tokens

  /register:
    post:
      summary: OAuth dynamic client registration (RFC 7591)
      responses:
        '201':
          description: Registered client

  /v1/enrollments/redeem:
    post:
      summary: Exchange a one-time enrollment code for a host credential
      description: >
        Codes come from agentAddressInstallLocal or POST /v1/account/local-install, expire after 15 minutes
        and work once. If the host already exists its credential is rotated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Host address and one-time addressToken
        '400':
          description: Code is invalid, expired or already used

  /v1/account/status:
    get:
      summary: Show the signed-in account, its organization, its hosts and one session's name
      description: >
        This is the Account API: everything an OAuth-authenticated account can do to name and
        manage its agent sessions, callable directly over HTTP by any product - our own remote MCP
        included - without speaking MCP.
      security:
        - oauth: []
      parameters:
        - in: query
          name: work_address_id
          required: false
          description: Immutable id of the session to describe. Omitted when the caller has none yet.
          schema: { type: string }
      responses:
        '200':
          description: Account, organization (or null), hosts and the named session (or null)

  /v1/account/work:
    post:
      summary: Name a session (register the organization/host if needed)
      security:
        - oauth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization: { type: string, description: Only needed to register a new organization. }
                organizationDisplayName: { type: string }
                host: { type: string, description: Machine name; needed unless the account has exactly one host. }
                handle: { type: string, description: Session name; a temporary name is assigned when omitted. }
                displayName: { type: string }
      responses:
        '201':
          description: organization, host and work addresses
        '409':
          description: account_has_organization, host_required or no_organization

  /v1/account/work/{addressId}:
    parameters:
      - in: path
        name: addressId
        required: true
        schema: { type: string }
    patch:
      summary: Rename the account's session, keeping the same host
      security:
        - oauth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [handle], properties: { handle: { type: string } } }
      responses:
        '200':
          description: Renamed address
        '403':
          description: Address does not belong to this account
    delete:
      summary: Release the account's session so the name can be reused
      security:
        - oauth: []
      responses:
        '200':
          description: Released address

  /v1/account/resolve:
    get:
      summary: Resolve @host/session in the account's organization, or org/host/session
      security:
        - oauth: []
      parameters:
        - in: query
          name: address
          required: true
          schema: { type: string, example: '@mypc/build-release' }
      responses:
        '200':
          description: Resolved address
        '404':
          description: Active address not found

  /v1/account/local-install:
    post:
      summary: Prepare a one-time code to enroll a machine into the account's organization
      description: >
        Registers the host if it is new and returns a code (enrollmentCode) a local agent redeems via
        POST /v1/enrollments/redeem to obtain that host's addr_HOST... credential.
      security:
        - oauth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [host], properties: { host: { type: string, example: mypc } } }
      responses:
        '200':
          description: Host address, enrollmentCode and expiresAt

components:
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /authorize
          tokenUrl: /token
          scopes: {}
    bearerAuth:
      type: http
      scheme: bearer
