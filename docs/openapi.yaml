openapi: 3.1.0
info:
  title: Agent Address Identity API
  version: 2.0.0
  description: |
    Organization/Agent/Session identity and Runtime ownership.
    This API registers and resolves identity; it does not transmit messages.
servers:
  - url: https://address.company-notes.com
security:
  - oauthBearer: []
paths:
  /v2/account/status:
    get:
      summary: Show signed-in account and Organization
      responses:
        '200': { description: Account identity and Organization }
        '401': { description: OAuth authorization required }
  /v2/account/organization:
    post:
      summary: Register Organization for the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, displayName]
              properties:
                slug: { type: string }
                displayName: { type: string }
      responses:
        '201': { description: Organization registered }
        '409': { description: Account already belongs to an Organization or name is taken }
  /v2/account/agents:
    get:
      summary: List Agents in the current Organization
      responses:
        '200': { description: Agent directory }
    post:
      summary: Register a new Agent and its initial default Session without occupying a Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAgent'
      responses:
        '201': { description: Agent/Session identity and one-time resume capability }
        '409': { description: Name conflict or no Organization }
  /v2/account/agents/claim:
    post:
      summary: Create a new Agent and Default Session with an exclusive Runtime lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAgent'
      responses:
        '201': { description: Agent/Session identity and resume/runtime capabilities }
        '409': { description: Name conflict or no Organization }
  /v2/account/agents/{agentID}/sessions:
    parameters:
      - $ref: '#/components/parameters/agentID'
    get:
      summary: List Sessions for one Agent
      responses:
        '200': { description: Sessions }
        '404': { description: Agent not found in this Organization }
    post:
      summary: Register an additional non-default Session without occupying a Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSession'
      responses:
        '201': { description: New Session and one-time capabilities }
  /v2/account/agents/{agentID}/sessions/claim:
    parameters:
      - $ref: '#/components/parameters/agentID'
    post:
      summary: Create a new non-default Session and acquire an exclusive Runtime lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSession'
      responses:
        '201': { description: Session identity and resume/runtime capabilities }
  /v2/account/sessions/{sessionID}:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    get:
      summary: Read one Session identity
      responses:
        '200': { description: Session identity }
        '404': { description: Not found or not in this Organization }
  /v2/account/sessions/{sessionID}/resume:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    post:
      summary: Resume an unoccupied Session with a private resume capability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resumeToken]
              properties:
                resumeToken: { type: string }
                runtimeLabel: { type: string }
      responses:
        '200': { description: New Runtime capability and existing Session identity }
        '403': { description: Invalid resume capability }
        '409': { description: Session already held by an active Runtime }
  /v2/account/sessions/{sessionID}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    post:
      summary: Renew the exclusive Runtime lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCapability'
      responses:
        '200': { description: Renewed expiration }
        '409': { description: Runtime is no longer the owner }
  /v2/account/sessions/{sessionID}/release:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    post:
      summary: Release Runtime ownership without deleting Session identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCapability'
      responses:
        '200': { description: Session is available for a subsequent authorized resume }
  /v2/account/resolve:
    get:
      summary: Resolve a canonical Session address or an Agent default Session
      parameters:
        - name: address
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Canonical Session }
        '403': { description: Address belongs to a different Organization }
components:
  parameters:
    agentID:
      name: agentID
      in: path
      required: true
      schema: { type: string }
    sessionID:
      name: sessionID
      in: path
      required: true
      schema: { type: string }
  schemas:
    NewSession:
      type: object
      properties:
        sessionName: { type: string }
        sessionDisplayName: { type: string }
        runtimeLabel: { type: string }
    NewAgent:
      allOf:
        - $ref: '#/components/schemas/NewSession'
        - type: object
          properties:
            agentName: { type: string }
            agentDisplayName: { type: string }
    RuntimeCapability:
      type: object
      required: [runtimeToken]
      properties:
        runtimeToken: { type: string }
  securitySchemes:
    oauthBearer:
      type: http
      scheme: bearer
      bearerFormat: OAuth
