openapi: 3.1.0
info:
  title: Agent Address Identity API
  version: 2.0.0
  description: |
    Organization/Agent/Session identity and Runtime ownership.
    This API registers and resolves identity; it does not transmit messages.
servers:
  - url: https://address.company-notes.com
security:
  - oauthBearer: []
paths:
  /v2/account/status:
    get:
      summary: Show signed-in account and Organization
      parameters:
        - name: include_grant
          in: query
          schema: { type: string, enum: ['1'] }
          description: Also return the authenticated OAuth grant fingerprint for internal Relay binding.
      responses:
        '200': { description: Account identity and Organization }
        '401': { description: OAuth authorization required }
  /v2/account/organization:
    patch:
      summary: Update Organization display name
      responses:
        '200': { description: Updated Organization }
    post:
      summary: Register Organization for the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, displayName]
              properties:
                slug: { type: string }
                displayName: { type: string }
      responses:
        '201': { description: Organization registered }
        '409': { description: Account already belongs to an Organization or name is taken }
  /v2/account/agents:
    get:
      summary: List Agents in the current Organization
      responses:
        '200': { description: Agent directory }
    post:
      summary: Register a new Agent and its initial default Session without occupying a Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAgent'
      responses:
        '201': { description: Agent/Session identity and one-time resume capability }
        '409': { description: Name conflict or no Organization }
  /v2/account/agent-runtime-leases:
    post:
      summary: Create a new Agent and Default Session with an exclusive Runtime lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAgent'
      responses:
        '201': { description: Agent/Session identity and resume/runtime capabilities }
        '409': { description: Name conflict or no Organization }
  /v2/account/agents/{agentID}:
    parameters:
      - $ref: '#/components/parameters/agentID'
    patch:
      summary: Change the Agent handle or display name; old address is not retained
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentName: { type: string }
                agentDisplayName: { type: [string, 'null'] }
      responses:
        '200': { description: Updated Agent }
        '409': { description: Agent name is already in use }
    delete:
      summary: Archive Agent and all Sessions; revoke active Runtime leases
      responses:
        '200': { description: Agent archived }
        '404': { description: Agent does not belong to current Organization }
  /v2/account/agents/{agentID}/sessions:
    parameters:
      - $ref: '#/components/parameters/agentID'
    get:
      summary: List Sessions for one Agent
      responses:
        '200': { description: Sessions }
        '404': { description: Agent not found in this Organization }
    post:
      summary: Register an additional non-default Session without occupying a Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSession'
      responses:
        '201': { description: New Session and one-time capabilities }
  /v2/account/agents/{agentID}/session-runtime-leases:
    parameters:
      - $ref: '#/components/parameters/agentID'
    post:
      summary: Create a new non-default Session and acquire an exclusive Runtime lease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSession'
      responses:
        '201': { description: Session identity and resume/runtime capabilities }
  /v2/account/sessions/{sessionID}:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    get:
      summary: Read one Session identity and non-sensitive Runtime state
      responses:
        '200': { description: Session identity }
        '404': { description: Not found or not in this Organization }
    patch:
      summary: Change Session handle or display name without changing its identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionName: { type: string }
                sessionDisplayName: { type: [string, 'null'] }
      responses:
        '200': { description: Updated Session with canonical address }
    delete:
      summary: Archive non-default Session and revoke its Runtime lease
      responses:
        '200': { description: Session archived }
        '409': { description: Assign another Default Session first }
  /v2/account/sessions/{sessionID}/default-selection:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    put:
      summary: Set the Agent's Default Session
      responses:
        '200': { description: Default Session changed atomically }
  /v2/account/sessions/{sessionID}/resume-credential:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    put:
      summary: Replace an existing Session's private resume capability
      responses:
        '200': { description: New one-time Resume Token; existing Runtime lease remains active }
  /v2/account/sessions/{sessionID}/owner-runtime-lease:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    put:
      summary: Restore an idle Session for its authenticated Organization owner
      description: |
        Explicitly recovers the same Agent and Session without the old Resume
        Token, rejecting an active Runtime. Returns a new private Runtime lease
        and rotated Resume Token for protected client storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                runtimeLabel: { type: string }
      responses:
        '200': { description: Existing Session, new exclusive Runtime and Resume capabilities }
        '404': { description: Session not in the authorized Organization }
        '409': { description: The existing Session has an active Runtime }
  /v2/account/sessions/{sessionID}/runtime-lease:
    parameters:
      - $ref: '#/components/parameters/sessionID'
    put:
      summary: Resume an unoccupied Session with a private resume capability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resumeToken]
              properties:
                resumeToken: { type: string }
                runtimeLabel: { type: string }
      responses:
        '200': { description: New Runtime capability and existing Session identity }
        '403': { description: Invalid resume capability }
        '409': { description: Session already held by an active Runtime }
    patch:
      summary: Renew the exclusive Runtime lease
      parameters:
        - name: include_identity
          in: query
          schema: { type: string, enum: ['1'] }
          description: Also return the verified Session and Organization in the same renewal response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCapability'
      responses:
        '200': { description: Renewed expiration }
        '409': { description: Runtime is no longer the owner }
    delete:
      summary: Release Runtime ownership without deleting Session identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeCapability'
      responses:
        '200': { description: Session available for a subsequent authorized resume }
  /v2/account/addresses:
    get:
      summary: Resolve a canonical Session address or an Agent default Session
      parameters:
        - name: address
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: Canonical Session }
        '403': { description: Address belongs to a different Organization }
components:
  parameters:
    agentID:
      name: agentID
      in: path
      required: true
      schema: { type: string }
    sessionID:
      name: sessionID
      in: path
      required: true
      schema: { type: string }
  schemas:
    NewSession:
      type: object
      properties:
        sessionName: { type: string }
        sessionDisplayName: { type: string }
        runtimeLabel: { type: string }
    NewAgent:
      allOf:
        - $ref: '#/components/schemas/NewSession'
        - type: object
          properties:
            agentName: { type: string }
            agentDisplayName: { type: string }
    RuntimeCapability:
      type: object
      required: [runtimeToken]
      properties:
        runtimeToken: { type: string }
  securitySchemes:
    oauthBearer:
      type: http
      scheme: bearer
      bearerFormat: OAuth
